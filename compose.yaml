services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: escape
      POSTGRES_USER: ${POSTGRES_USER:-escape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Docker Compose}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - escape-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d escape']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  escape-data:
