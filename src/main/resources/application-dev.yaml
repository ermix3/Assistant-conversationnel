# Local mail capture with the Mailpit service in compose.yaml.
spring:
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.ssl.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
#  docker:
#    compose:
#      stop:
#        command: down
club:
  notifications:
    enabled: ${MAIL_NOTIFICATIONS_ENABLED:true}
    to: ${STAFF_NOTIFICATION_TO:staff@example.invalid}
    from: ${STAFF_NOTIFICATION_FROM:assistant@example.invalid}
    interval-ms: 5000